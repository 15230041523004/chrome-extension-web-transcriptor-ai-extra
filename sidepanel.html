<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Transcriptior</title>
    <script type="module" src="/sidepanel-inline-debug.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        min-height: 100vh;
        margin: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow: hidden;
      }
      #inline-debug-toggle {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      #inline-debug {
        position: fixed;
        right: 4px;
        bottom: 36px;
        z-index: 2147483646;
        box-sizing: border-box;
        width: min(calc(100vw - 24px), 352px);
        padding: 10px 12px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10px;
        line-height: 1.4;
        color: #3f3f46;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      #inline-debug-status {
        margin-bottom: 6px;
        font-family: system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #18181b;
      }
      #inline-debug-log {
        margin: 0 0 8px;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        color: #52525b;
        background: #f4f4f5;
        border-radius: 6px;
        padding: 8px;
      }
      #inline-copy-log {
        cursor: pointer;
        border: 1px solid #d4d4d8;
        background: #f4f4f5;
        color: #18181b;
        border-radius: 6px;
        padding: 6px 10px;
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      #inline-copy-log:hover {
        background: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        #inline-debug {
          color: #d4d4d8;
          background: #18181b;
          border-color: #3f3f46;
        }
        #inline-debug-status {
          color: #fafafa;
        }
        #inline-debug-log {
          color: #a1a1aa;
          background: #27272a;
        }
        #inline-copy-log {
          border-color: #52525b;
          background: #27272a;
          color: #fafafa;
        }
        #inline-copy-log:hover {
          background: #3f3f46;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-fallback"
        style="
          box-sizing: border-box;
          min-height: 100vh;
          padding: 16px;
          font-family: system-ui, sans-serif;
          font-size: 14px;
          color: #e5e5e5;
          background: #0a0a0a;
        "
      >
        <p style="margin: 0 0 8px; font-weight: 600">Loading panel…</p>
        <p style="margin: 0; font-size: 12px; color: #a3a3a3">
          If this stays empty, click the <strong>bug icon</strong> in the corner and copy the full log.
        </p>
      </div>
    </div>

    <button
      type="button"
      id="inline-debug-toggle"
      aria-label="Open debug log"
      aria-expanded="false"
      aria-controls="inline-debug"
    >
      🐛
    </button>

    <div id="inline-debug" hidden>
      <div id="inline-debug-status">Debug: waiting for panel module…</div>
      <pre id="inline-debug-log">(loading log…)</pre>
      <button type="button" id="inline-copy-log">Copy FULL log</button>
    </div>

    <script type="module" src="/src/side-panel.tsx"></script>
  </body>
</html>
